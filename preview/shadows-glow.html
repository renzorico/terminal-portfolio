<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style></head><body>
<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div style="width:80px;height:50px;background:var(--bg-2);border:1px solid var(--fg-3);border-radius:2px;"></div>
    <span style="font-size:9px;color:var(--fg-2);">no glow</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div style="width:80px;height:50px;background:var(--bg-2);border:1px solid var(--green-dim);border-radius:2px;box-shadow:0 0 4px #0a5c1f;"></div>
    <span style="font-size:9px;color:var(--fg-2);">glow-sm</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div style="width:80px;height:50px;background:var(--bg-2);border:1px solid var(--green-dim);border-radius:2px;box-shadow:0 0 8px #0a5c1f, 0 0 16px rgba(0,214,50,0.1);"></div>
    <span style="font-size:9px;color:var(--fg-2);">glow-md</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:center;">
    <div style="width:80px;height:50px;background:var(--bg-2);border:1px solid var(--green-dim);border-radius:2px;box-shadow:0 0 16px #0a5c1f, 0 0 32px rgba(0,214,50,0.15);"></div>
    <span style="font-size:9px;color:var(--fg-2);">glow-lg</span>
  </div>
</div>
</body></html>
