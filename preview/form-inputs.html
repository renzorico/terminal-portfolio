<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style><style>
.input{font-family:var(--font-mono);font-size:13px;padding:8px 12px;background:var(--bg-1);border:1px solid var(--fg-3);border-radius:2px;color:var(--fg-0);outline:none;width:200px;}
.input:focus{border-color:var(--green-primary);box-shadow:0 0 4px rgba(0,214,50,0.15);}
.input::placeholder{color:var(--fg-2);}
.label{font-size:10px;color:var(--fg-2);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px;}
</style></head><body>
<div style="display:flex;gap:20px;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:4px;">
    <span class="label">query</span>
    <input class="input" placeholder="SELECT * FROM..." />
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <span class="label">focused</span>
    <input class="input" value="renzo.rico" style="border-color:var(--green-primary);box-shadow:0 0 4px rgba(0,214,50,0.15);" />
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <span class="label">disabled</span>
    <input class="input" disabled value="read-only" style="opacity:0.4;" />
  </div>
</div>
</body></html>
