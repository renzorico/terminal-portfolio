<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style><style>
.btn{font-family:var(--font-mono);font-size:13px;padding:8px 20px;border:1px solid;cursor:pointer;transition:all 150ms;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--green-primary);color:#0a0a0a;border-color:var(--green-primary);border-radius:2px;font-weight:600;}
.btn-primary:hover{background:var(--green-bright);box-shadow:0 0 8px rgba(0,214,50,0.2);}
.btn-outline{background:transparent;color:var(--green-primary);border-color:var(--green-dim);border-radius:2px;}
.btn-outline:hover{border-color:var(--green-primary);background:var(--green-subtle);}
.btn-ghost{background:transparent;color:var(--fg-1);border-color:transparent;border-radius:2px;}
.btn-ghost:hover{color:var(--fg-0);background:var(--bg-3);}
.btn-amber{background:var(--amber-primary);color:#0a0a0a;border-color:var(--amber-primary);border-radius:2px;font-weight:600;}
.btn-sm{font-size:11px;padding:4px 12px;}
</style></head><body>
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
  <button class="btn btn-primary">run script</button>
  <button class="btn btn-outline">view source</button>
  <button class="btn btn-ghost">cancel</button>
  <button class="btn btn-amber">★ featured</button>
  <button class="btn btn-primary btn-sm">sm</button>
  <button class="btn btn-outline" style="opacity:0.4;pointer-events:none;">disabled</button>
</div>
</body></html>
