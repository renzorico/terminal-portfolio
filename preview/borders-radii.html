<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style></head><body>
<div style="display:flex;gap:16px;align-items:end;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
      <div style="width:60px;height:40px;border:1px solid var(--fg-3);border-radius:0;background:var(--bg-2);"></div>
      <span style="font-size:9px;color:var(--fg-2);">none · 0</span>
    </div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
      <div style="width:60px;height:40px;border:1px solid var(--fg-3);border-radius:2px;background:var(--bg-2);"></div>
      <span style="font-size:9px;color:var(--fg-2);">sm · 2px</span>
    </div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
      <div style="width:60px;height:40px;border:1px solid var(--fg-3);border-radius:4px;background:var(--bg-2);"></div>
      <span style="font-size:9px;color:var(--fg-2);">md · 4px</span>
    </div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
      <div style="width:60px;height:40px;border:1px solid var(--fg-3);border-radius:6px;background:var(--bg-2);"></div>
      <span style="font-size:9px;color:var(--fg-2);">lg · 6px</span>
    </div><div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
      <div style="width:60px;height:40px;border:1px solid var(--fg-3);border-radius:9999px;background:var(--bg-2);"></div>
      <span style="font-size:9px;color:var(--fg-2);">pill · 9999px</span>
    </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:60px;height:40px;border:1px solid var(--green-primary);border-radius:2px;background:var(--bg-2);"></div>
    <span style="font-size:9px;color:var(--fg-2);">focus border</span>
  </div>
</div>
</body></html>
