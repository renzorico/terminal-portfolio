<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style></head><body>
<div style="display:flex;gap:16px;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;gap:4px;">
      <div style="width:50px;height:40px;background:#ffb800;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#e5a500;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#b38200;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#5c4300;border-radius:2px;"></div>
    </div>
    <span style="font-size:10px;color:var(--fg-1);">amber</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;gap:4px;">
      <div style="width:50px;height:40px;background:#00e5ff;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#00bcd4;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#00838f;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#004d56;border-radius:2px;"></div>
    </div>
    <span style="font-size:10px;color:var(--fg-1);">cyan</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;gap:4px;">
      <div style="width:50px;height:40px;background:#c77dff;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#9d4edd;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#7b2cbf;border-radius:2px;"></div>
      <div style="width:50px;height:40px;background:#ff3d3d;border-radius:2px;"></div>
    </div>
    <span style="font-size:10px;color:var(--fg-1);">purple / red</span>
  </div>
</div>
</body></html>
