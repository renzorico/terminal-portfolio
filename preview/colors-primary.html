<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style></head><body>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:80px;height:60px;background:#00ff41;border-radius:2px;"></div>
    <span style="font-size:10px;color:var(--fg-1);">green-bright</span>
    <span style="font-size:9px;color:var(--fg-2);">#00ff41</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:80px;height:60px;background:#00d632;border-radius:2px;"></div>
    <span style="font-size:10px;color:var(--fg-1);">green-primary</span>
    <span style="font-size:9px;color:var(--fg-2);">#00d632</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:80px;height:60px;background:#00a828;border-radius:2px;"></div>
    <span style="font-size:10px;color:var(--fg-1);">green-muted</span>
    <span style="font-size:9px;color:var(--fg-2);">#00a828</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:80px;height:60px;background:#0a5c1f;border-radius:2px;"></div>
    <span style="font-size:10px;color:var(--fg-1);">green-dim</span>
    <span style="font-size:9px;color:var(--fg-2);">#0a5c1f</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:4px;align-items:center;">
    <div style="width:80px;height:60px;background:#0d2b14;border-radius:2px;"></div>
    <span style="font-size:10px;color:var(--fg-1);">green-subtle</span>
    <span style="font-size:9px;color:var(--fg-2);">#0d2b14</span>
  </div>
</div>
</body></html>
