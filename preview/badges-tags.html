<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><link rel="stylesheet" href="../colors_and_type.css"><style>*{margin:0;box-sizing:border-box}body{background:var(--bg-0);color:var(--fg-0);font-family:var(--font-mono);padding:20px;}</style><style>
.badge{font-family:var(--font-mono);font-size:10px;padding:3px 8px;border-radius:2px;display:inline-block;letter-spacing:0.05em;text-transform:uppercase;font-weight:500;}
</style></head><body>
<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
  <span class="badge" style="background:var(--green-subtle);color:var(--green-primary);border:1px solid var(--green-dim);">python</span>
  <span class="badge" style="background:var(--cyan-subtle);color:var(--cyan-primary);border:1px solid var(--cyan-dim);">tensorflow</span>
  <span class="badge" style="background:var(--amber-subtle);color:var(--amber-primary);border:1px solid var(--amber-dim);">featured</span>
  <span class="badge" style="background:var(--bg-3);color:var(--fg-1);border:1px solid var(--fg-3);">2024</span>
  <span class="badge" style="background:var(--red-dim);color:var(--red-bright);border:1px solid var(--red-muted);">wip</span>
  <span class="badge" style="background:var(--purple-muted);color:#e0c0ff;border:1px solid var(--purple-primary);">ml</span>
  <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-2);">· pill →</span>
  <span class="badge" style="background:var(--green-primary);color:#0a0a0a;border-radius:9999px;padding:3px 10px;font-weight:600;">online</span>
</div>
</body></html>
