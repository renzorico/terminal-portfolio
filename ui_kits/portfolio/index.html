<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>renzo.rico — portfolio</title>
  <link rel="stylesheet" href="../../colors_and_type.css" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg-0);
      color: var(--fg-0);
      font-family: var(--font-mono);
      min-height: 100vh;
    }

    /* Responsive nav */
    @media (min-width: 640px) {
      .mobile-hamburger { display: none !important; }
    }
    @media (max-width: 639px) {
      .desktop-nav { display: none !important; }
      .mobile-hamburger { display: block !important; }
    }

    .section {
      max-width: 900px;
      margin: 0 auto;
      padding: 64px 20px;
    }

    .section-label {
      font-size: 10px;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 8px;
    }

    .section-title {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 600;
      color: var(--fg-0);
      margin-bottom: 32px;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3.8rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--fg-0);
      margin-bottom: 12px;
    }

    .hero-sub {
      font-size: var(--text-md);
      color: var(--fg-1);
      margin-bottom: 32px;
      line-height: 1.6;
    }

    .exhibit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .about-block {
      background: var(--bg-1);
      border: 1px solid var(--fg-3);
      border-radius: 2px;
      padding: 24px;
      font-size: 14px;
      line-height: 1.8;
      color: var(--fg-1);
    }
    .about-block .comment { color: var(--fg-2); }
    .about-block .key { color: var(--amber-primary); }
    .about-block .val { color: var(--fg-0); }
    .about-block .str { color: var(--green-primary); }

    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 480px;
    }
    .contact-form label {
      font-size: 10px;
      color: var(--fg-2);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 4px;
    }
    .contact-form input,
    .contact-form textarea {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 10px 12px;
      background: var(--bg-1);
      border: 1px solid var(--fg-3);
      border-radius: 2px;
      color: var(--fg-0);
      outline: none;
      transition: border-color 150ms;
    }
    .contact-form input:focus,
    .contact-form textarea:focus {
      border-color: var(--green-primary);
      box-shadow: 0 0 4px rgba(0,214,50,0.15);
    }
    .contact-form textarea { resize: vertical; min-height: 100px; }
    .contact-form button {
      font-family: var(--font-mono);
      font-size: 13px;
      padding: 10px 24px;
      background: var(--green-primary);
      color: #0a0a0a;
      border: 1px solid var(--green-primary);
      border-radius: 2px;
      font-weight: 600;
      cursor: pointer;
      transition: all 150ms;
      align-self: flex-start;
    }
    .contact-form button:hover {
      background: var(--green-bright);
      box-shadow: 0 0 8px rgba(0,214,50,0.2);
    }

    .footer {
      text-align: center;
      padding: 32px 20px;
      font-size: 11px;
      color: var(--fg-2);
      border-top: 1px solid var(--fg-3);
    }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.06) 2px,
        rgba(0,0,0,0.06) 4px
      );
      z-index: 999;
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="scanlines"></div>
  <div id="root"></div>

  <script type="text/babel" src="TerminalHeader.jsx"></script>
  <script type="text/babel" src="ExhibitCard.jsx"></script>
  <script type="text/babel" src="TerminalPrompt.jsx"></script>
  <script type="text/babel" src="SkillsTable.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* Typing animation hook */
    const useTypewriter = (text, speed = 40, delay = 500) => {
      const [displayed, setDisplayed] = useState('');
      const [done, setDone] = useState(false);
      useEffect(() => {
        let i = 0;
        const timeout = setTimeout(() => {
          const interval = setInterval(() => {
            i++;
            setDisplayed(text.slice(0, i));
            if (i >= text.length) { clearInterval(interval); setDone(true); }
          }, speed);
          return () => clearInterval(interval);
        }, delay);
        return () => clearTimeout(timeout);
      }, [text]);
      return [displayed, done];
    };

    /* Hero section */
    const Hero = () => {
      const [title, titleDone] = useTypewriter('$ renzo.rico --about', 50, 300);
      return (
        <div style={{ minHeight: '70vh', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
          <div className="hero-title">
            {title}<span style={{ color: '#00ff41', animation: titleDone ? 'none' : 'blink 1s step-end infinite' }}>{titleDone ? '' : '█'}</span>
          </div>
          <div className="hero-sub">
            data scientist · python · llms · ml · sql<br />
            i build things with a point. london.
          </div>
          <TerminalPrompt />
        </div>
      );
    };

    /* Exhibits section */
    const exhibits = [
      { title: 'no-botes-tu-voto', description: 'Election platform that cuts through political noise so Colombians can vote based on facts.', tags: ['python','web-scraping','vercel'], metrics: 'research · prompt engineering' },
      { title: 'legalize-co', description: 'Open-source contribution to make Colombian legislation readable for anyone.', tags: ['python','data-pipelines','git','rest-apis'], metrics: 'open-source · data engineering' },
      { title: 'ds-radar', description: 'Agentic pipeline that scrapes, scores, and ranks jobs based on how well they actually fit me.', tags: ['python','ai-agents','rest-apis','cli'], metrics: 'prompt engineering · automation' },
      { title: 'the-london-bible', description: 'Geospatial data project exploring London through interactive maps and visualizations.', tags: ['typescript','next.js','maplibre','d3.js'], metrics: 'supabase · geospatial' },
      { title: 'bjj-universe', description: 'Interactive 3D visualization of the Brazilian Jiu-Jitsu competitive universe.', tags: ['javascript','three.js','d3.js'], metrics: 'data viz · 3d' },
      { title: 'un-speeches', description: 'NLP analysis of United Nations speeches using LLMs and text analytics.', tags: ['python','nlp','tensorflow','gcp'], metrics: 'deep learning · generative ai' },
    ];

    const Exhibits = () => (
      <div>
        <div className="section-label">$ ls projects/</div>
        <div className="section-title">PROJECTS</div>
        <div className="exhibit-grid">
          {exhibits.map(ex => <ExhibitCard key={ex.title} {...ex} />)}
        </div>
      </div>
    );

    /* Skills section */
    const Skills = () => (
      <div>
        <div className="section-label">$ ls ~/.skills/</div>
        <div className="section-title">SKILLS</div>
        <div style={{ background: '#111111', border: '1px solid #444444', borderRadius: 2, padding: 20 }}>
          <SkillsTable />
        </div>
      </div>
    );

    /* About section */
    const About = () => (
      <div>
        <div className="section-label">$ cat about.json</div>
        <div className="section-title">ABOUT</div>
        <div className="about-block">
          <div className="comment">// about.json</div>
          <div>{'{'}</div>
          <div style={{ paddingLeft: 20 }}>
            <span className="key">"name"</span>: <span className="str">"Renzo Rico"</span>,<br />
            <span className="key">"role"</span>: <span className="str">"Data Scientist"</span>,<br />
            <span className="key">"headline"</span>: <span className="str">"Python · LLMs · ML · SQL"</span>,<br />
            <span className="key">"location"</span>: <span className="str">"London"</span>,<br />
            <span className="key">"github"</span>: <span className="str">"github.com/renzorico"</span>,<br />
            <span className="key">"background"</span>: <span className="str">"Trained as an architect. Ended up in data science."</span>,<br />
            <span className="key">"bio"</span>: <span className="str">"I build things with a point. Both fields reward the same things: thinking in systems, obsessive attention to detail, and knowing when something isn't finished yet."</span>,<br />
            <span className="key">"looking_for"</span>: <span className="str">"A team that builds things with a point too."</span>
          </div>
          <div>{'}'}</div>
        </div>
      </div>
    );

    /* Contact section */
    const Contact = () => {
      const [sent, setSent] = useState(false);
      return (
        <div>
          <div className="section-label">$ ./contact.sh</div>
          <div className="section-title">CONTACT</div>
          {sent ? (
            <div style={{ color: '#00d632', fontSize: 14 }}>
              <span style={{ marginRight: 6 }}>●</span> message sent successfully. renzo will respond shortly.
            </div>
          ) : (
            <div className="contact-form">
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <label>from</label>
                <input type="email" placeholder="you@company.com" />
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <label>subject</label>
                <input type="text" placeholder="re: collaboration" />
              </div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
                <label>message</label>
                <textarea placeholder="your message..."></textarea>
              </div>
              <button onClick={() => setSent(true)}>send --message</button>
            </div>
          )}
        </div>
      );
    };

    /* App */
    const App = () => (
      <div>
        <TerminalHeader />
        <div id="lobby" className="section"><Hero /></div>
        <div id="exhibits" className="section" style={{ borderTop: '1px solid #242424' }}><Exhibits /></div>
        <div id="skills" className="section" style={{ borderTop: '1px solid #242424' }}><Skills /></div>
        <div id="about" className="section" style={{ borderTop: '1px solid #242424' }}><About /></div>
        <div id="contact" className="section" style={{ borderTop: '1px solid #242424' }}><Contact /></div>
        <div className="footer">
          built with █░░ by renzo.rico · 2024 · src available on github
        </div>
      </div>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
